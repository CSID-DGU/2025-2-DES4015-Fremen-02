spring:
  application:
    name: backend
  profiles:
    active: local


  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        show_sql: true
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
---
# ==================================================================
# local (??) ?? ?? ??
# ==================================================================
spring:
  config:
    activate:
      on-profile: local

  datasource:
    # ?? ?? ?? ? ??? ??
    url: "jdbc:mysql://localhost:3306/fremen?serverTimezone=Asia/Seoul&useUnicode=true&characterEncoding=UTF-8"
    username: root
    password: ${DB_LOCAL_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

erver:
  port: 8080




---
# ==================================================================
# prod (??) ?? ?? ??
# ==================================================================
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        show_sql: false
        format_sql: false

